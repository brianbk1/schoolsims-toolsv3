<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>SchoolSims Email Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: brand bar -> two columns: sticky brief form (left) and generated send plan + 3 plain-text emails + voicemail (right); stacks on phones. */
:root{
  --bg:#F4F4F9; --surface:#FFFFFF; --sunk:#EBEBF3; --fg:#1B1A3A; --muted:#5D5C7A; --line:#DCDBE8;
  --primary:#2D2B6F; --on-primary:#FFFFFF; --maroon:#9F354F; --maroon-soft:#F6E5EA;
  --peri:#5E7FCC; --peri-soft:#E5EBFA;
  --good:#1D7349; --good-soft:#E1F2E8; --warn:#8F5B00; --warn-soft:#FAEFD8;
  --shadow:0 1px 2px rgba(27,26,58,.06),0 4px 16px rgba(27,26,58,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111027; --surface:#1A1936; --sunk:#232244; --fg:#ECEBF7; --muted:#A4A3C4; --line:#33325A;
  --primary:#A9A7F2; --on-primary:#15142E; --maroon:#E48AA0; --maroon-soft:#3A1F2B;
  --peri:#9DB6EF; --peri-soft:#222C4C; --good:#7FD3A6; --good-soft:#173628; --warn:#F0C06A; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111027; --surface:#1A1936; --sunk:#232244; --fg:#ECEBF7; --muted:#A4A3C4; --line:#33325A;
  --primary:#A9A7F2; --on-primary:#15142E; --maroon:#E48AA0; --maroon-soft:#3A1F2B;
  --peri:#9DB6EF; --peri-soft:#222C4C; --good:#7FD3A6; --good-soft:#173628; --warn:#F0C06A; --warn-soft:#3A2E14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--peri)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.maroon{background:var(--maroon);color:var(--on-primary);border-color:var(--maroon)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-k12{background:var(--peri-soft);color:var(--peri)} .p-higher{background:var(--maroon-soft);color:var(--maroon)}
.p-indep{background:var(--good-soft);color:var(--good)} .p-cte{background:var(--warn-soft);color:var(--warn)} .p-other{background:var(--sunk);color:var(--muted)}
.t1{background:var(--primary);color:var(--on-primary)} .t2{background:var(--peri-soft);color:var(--peri)} .t3{background:var(--sunk);color:var(--muted)}
.mined{background:var(--warn-soft);color:var(--warn)}

/* brand bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;margin-right:auto}
.dot{width:30px;height:30px;border-radius:50%;background:var(--maroon);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px}
.mark b{font-family:var(--f-display);font-size:18px}
.mark span{color:var(--muted);font-size:13px;display:block;line-height:1.1}

/* setup */
.band{display:grid;gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .chev{margin-left:auto;transition:transform .15s}
details[open].card>summary .chev{transform:rotate(90deg)}
.prompts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.prompt{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0}
.prompt pre{margin:0;white-space:pre-wrap;font:12.5px/1.55 var(--f-mono);max-height:220px;overflow:auto}
.prompt .hd{display:flex;align-items:center;gap:8px}
.prompt .hd .btn{margin-left:auto}
.uploads{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--surface);cursor:pointer;min-width:0}
.drop.over{border-color:var(--peri);background:var(--peri-soft)}
.drop.loaded{border-style:solid}
.drop .top{display:flex;align-items:center;gap:8px}
.drop input{display:none}
.drop .stat{font-size:13px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

/* summary strip */
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;margin-top:20px}
.strip .n{font-family:var(--f-display);font-size:26px;font-weight:700}
.strip .k{color:var(--muted);font-size:13px;margin-left:4px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--maroon)}
.panel{margin-top:16px}

/* days */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;text-align:left;min-width:96px}
.day b{display:block;font-family:var(--f-display);font-size:16px}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.day[aria-pressed="true"] span{color:inherit;opacity:.8}
.daygrid{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:14px;align-items:start}
@media (max-width:880px){.daygrid{grid-template-columns:1fr}}

/* timeline */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:880px){.rail{position:static}}
.tl{display:grid;gap:0;margin-top:10px;max-height:70vh;overflow:auto}
.ev{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.ev .w{min-width:0}
.ev .w b{font-weight:600}
.ev.blk{background:var(--sunk);border-radius:8px;padding:8px;border-top:0;margin:6px 0}
.ev.blk .t{color:var(--fg)}
.step{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.s-c1{color:var(--peri)} .s-c2{color:var(--maroon)} .s-em{color:var(--good)} .s-pr{color:var(--muted)}

/* account cards */
.accts{display:grid;gap:14px}
.acct .head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.acct .head .nm{min-width:0;flex:1}
.score{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;text-align:right}
.score small{display:block;font:600 10px/1.4 var(--f-body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.why span{font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 7px;color:var(--muted)}
.clist{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
.crow:hover .cn{color:var(--peri)}
.crow:last-child{border-bottom:0}
.cn{font-weight:600}
.cmeta{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ctimes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-size:12px}
.ctimes .mono{background:var(--sunk);border-radius:6px;padding:2px 6px}
.acct .foot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.slot{border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;color:var(--muted)}

/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,30,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(620px,100%);height:100%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(18px + env(safe-area-inset-top,0px))}
.drawer .dh{display:flex;gap:10px;align-items:flex-start}
.drawer .dh>div{flex:1;min-width:0}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:9px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.doc pre{margin:0;white-space:pre-wrap;font:14px/1.6 var(--f-body)}
.doc .dhd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.doc .dhd .btn{margin-left:auto}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:12px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* finder */
.engine{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.engine .txt{flex:1;min-width:240px;display:grid;gap:4px}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--maroon);width:0;transition:width .3s}
.found{display:grid;gap:10px;margin-top:14px}
.frow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.frow a{color:var(--peri);font-size:13px;overflow-wrap:anywhere}

/* stepper + steps */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.stp{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;font-weight:600;font-size:14px;min-width:0}
.stp i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font:700 13px/1 var(--f-display);flex:none}
.stp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp[aria-current="step"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.stp[aria-current="step"] i{background:var(--maroon);color:#fff}
.stp.done i{background:var(--good-soft);color:var(--good)}
@media (max-width:640px){.stp span{display:none}.stp{justify-content:center}}
.stepview{margin-top:16px}
.shd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.next{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.calc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:880px){.calc{grid-template-columns:1fr}}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.inputs .full{grid-column:1/-1}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.months button[aria-pressed="true"]{background:var(--maroon-soft);color:var(--maroon);border-color:var(--maroon)}
.result{background:var(--sunk);border-radius:12px;padding:16px;display:grid;gap:12px}
.big{font:700 52px/1 var(--f-display);color:var(--maroon);font-variant-numeric:tabular-nums}
.chain{display:grid;gap:0;font-size:14px}
.chain div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.chain div:first-child{border-top:0}
.chain b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13.5px}
.okbox{background:var(--good-soft);color:var(--good);border-radius:8px;padding:8px 10px;font-size:13.5px}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:140px}
.bar-cell i{display:block;height:8px;border-radius:4px;background:var(--peri)}
.bar-cell i.hot{background:var(--maroon)}
tr.low td{color:var(--muted)}
.revtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.revtools input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;flex:1;min-width:200px}
.seg.sm{margin-top:0}
.seg.sm button{padding:5px 12px;font-size:13px}
td select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:13px;max-width:190px}
tr.ex td{opacity:.55}
tr.ex td:first-child,tr.ex td:last-child{opacity:1}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;margin-top:18px;align-items:start}
.welcome h1{font-size:26px;margin:4px 0 6px}
.welcome ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
@media (max-width:760px){.welcome{grid-template-columns:1fr}}
.tip{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.5}
.tip b{color:var(--warn)}
.settings .check{justify-content:flex-start;text-align:left}
.check input{width:auto!important;flex:none}
.drop.big{justify-items:center;text-align:center;padding:26px 16px;border-width:2px;gap:8px}
.drop.big .top{justify-content:center;flex-wrap:wrap}
.drop.big .pick{pointer-events:none;margin-top:4px}
.upico{width:34px;height:34px;color:var(--peri)}
.howto{margin:10px 0 0;padding-left:20px;display:grid;gap:10px;font-size:14.5px;max-width:80ch}
.urlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.urlrow code,.howto code{font:12.5px var(--f-mono);background:var(--sunk);border-radius:6px;padding:4px 7px;overflow-wrap:anywhere;min-width:0}
.urlrow code{flex:1 1 260px}
.gapgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:700px){.gapgrid{grid-template-columns:1fr}}
.need{display:grid;gap:4px;margin-top:8px}
.need .nt{font-size:13.5px}.need .nt a{color:var(--peri)}
.act-need{background:var(--maroon-soft);color:var(--maroon);justify-self:start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;z-index:60;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.bar .engine{font-size:13px}
.ew{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}
@media (max-width:900px){.ew{grid-template-columns:1fr}}
.form{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px)}
@media (max-width:900px){.form{position:static}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.opt{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
.hint{font-size:12.5px;color:var(--warn);margin-top:2px}
.hint:empty{display:none}
textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;font:14px/1.5 var(--f-body);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--fg)}
.chip:hover{border-color:var(--peri)}
.more summary{cursor:pointer}
.btn.big{justify-content:center;padding:11px 14px;font-size:15px}
.small{font-size:13px}
.out{display:grid;gap:14px;min-width:0}
.mail .mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.subj{margin-top:10px;display:grid;gap:4px}
.sv{font:600 16px/1.4 var(--f-body);border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.alt{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--peri);font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.body{margin-top:10px;font:14.5px/1.6 var(--f-body);background:var(--sunk);border-color:transparent;min-height:120px}
.lint{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12.5px}
.lint .warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 8px}
.lint .ok{background:var(--good-soft);color:var(--good);border-radius:6px;padding:3px 8px}
.steps{margin:12px 0 10px;padding-left:20px;display:grid;gap:8px}
.steps li b{display:block;font-family:var(--f-display)}
.steps li span{font-size:14px;color:var(--muted)}
.tips{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--maroon);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.check input{width:auto!important}
</style>
<header class="bar"><div class="wrap">
  <a class="mark" href="/" title="All SchoolSims tools" style="color:inherit;text-decoration:none"><div class="dot" aria-hidden="true">S</div><div><b>SchoolSims</b><span>Email Writer</span></div></a>
  <span class="muted engine" id="engine"></span>
</div></header>

<main class="wrap ew">
  <form class="card form" id="form" autocomplete="off">
    <div class="shd"><h2>Who are you writing to?</h2></div>
    <div class="grid2">
      <div class="field"><label class="label" for="fType">Contact type</label><select id="fType"><option value="prospect">Prospect</option><option value="client">Client</option><option value="former">Former client</option></select></div>
      <div class="field"><label class="label" for="fInd">Industry</label><select id="fInd"><option value="district">K-12 district</option><option value="higher">Higher ed</option><option value="indep">Independent school</option><option value="other">Other</option></select></div>
      <div class="field full"><label class="label" for="fPurpose">Email purpose</label><select id="fPurpose"><option value="prospecting">Prospecting</option><option value="proactive">Client proactive outreach</option><option value="renewal">Renewal</option></select><p class="hint" id="purposeHint"></p></div>
      <div class="field full"><label class="label" for="fTitle">Job title</label><input id="fTitle" placeholder="e.g. Director of Professional Learning"></div>
      <div class="field"><label class="label" for="fFirst">First name <span class="opt">optional</span></label><input id="fFirst" placeholder="Blank = HubSpot token"></div>
      <div class="field"><label class="label" for="fOrg">Organization <span class="opt">optional</span></label><input id="fOrg" placeholder="Blank = HubSpot token"></div>
      <div class="field full" id="renewWrap" hidden><label class="label" for="fRenew">Contract end date <span class="opt">optional</span></label><input id="fRenew" type="date"></div>
    </div>
    <div class="field"><label class="label" for="fContext">Context for the email</label><textarea id="fContext" rows="5" placeholder="What do you know? Recent usage, a conversation, a new initiative at their school, a trigger event, a pain point..."></textarea></div>
    <div class="field"><label class="label" for="fCta">Call to action</label><textarea id="fCta" rows="2" placeholder="What should they do next?"></textarea><div class="chips" id="ctaChips"></div></div>
    <details class="more"><summary class="label">Sender &amp; options</summary>
      <div class="grid2" style="margin-top:10px">
        <div class="field"><label class="label" for="sName">Your name</label><input id="sName" placeholder="Janet Jaramillo"></div>
        <div class="field"><label class="label" for="sTitleIn">Your title</label><input id="sTitleIn" placeholder="Account Executive"></div>
        <div class="field"><label class="label" for="sPhone">Your phone</label><input id="sPhone" placeholder="484-240-9520"></div>
        <div class="field"><label class="label" for="fLen">Length</label><select id="fLen"><option value="short">Short (under 90 words)</option><option value="standard">Standard (under 140 words)</option></select></div>
        <div class="field"><label class="label" for="fTone">Tone</label><select id="fTone"><option value="warm">Warm and personal</option><option value="direct">Direct and brief</option><option value="formal">Formal (superintendent, dean)</option></select></div>
        <div class="field"><label class="label" for="fStart">First send date</label><input id="fStart" type="date"></div>
        <label class="check full"><input type="checkbox" id="fOpt"> Add an opt-out line (recommended for prospecting)</label>
      </div>
    </details>
    <button class="btn primary big" id="go" type="submit">Write 3 emails</button>
    <p class="muted small" id="goNote"></p>
  </form>

  <section class="out" id="out" aria-live="polite"></section>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,f){try{const v=localStorage.getItem("ssew_"+k);return v?JSON.parse(v):f}catch{return f}},set(k,v){try{localStorage.setItem("ssew_"+k,JSON.stringify(v))}catch{}}};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
async function copy(text,el){try{await navigator.clipboard.writeText(text);toast("Copied")}catch{if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Ctrl/Cmd+C")}}}

/* ---------- SchoolSims.com facts the emails may use (nothing else) ---------- */
const FACTS=`SCHOOLSIMS FACTS (from schoolsims.com). Use only these; do not invent statistics, customers or features.
- What it is: interactive, branching "choose-your-own-adventure" simulations where educators and education students practice critical decisions in a safe, risk-free environment, then learn from the outcomes. Each sim has six or more decision points. Runs in any browser, in person or remote, synchronous or asynchronous. LMS integration available.
- Tagline: "Experience is the best teacher."
- AI Coaching Debrief ("Coachable Moments by Design"): after a sim, participants have a voice-based coaching conversation with an AI coach to reflect on decisions, spot patterns, rehearse better responses and set next steps. Produces a personalized coaching summary. Quote: "It's like giving every participant their own instructional coach, at scale." (Director of Professional Learning)
- Data: built-in data and insights for program evaluation; Educator Insights Dashboard; AI-driven accreditation dashboard for higher ed (automated analysis and compliance reporting).
- Standards: aligned to PSEL, NELP, CAEP, InTASC, AAQEP, NAIS (independent schools) and state-specific standards.
- Topics include: classroom management, IEPs, parent-teacher conferences, difficult conversations, instructional and operational leadership, student safety, leading change, equity, student mental health, crisis intervention, academic advising, behavior support.
- Programs: School District Induction Program; School Leadership Professional Development and Recertification Program; Culturally Responsive School Leadership (CRSL) Program; Independent School Simulation-Based Professional Learning Plan; teacher, school leader and school counselor preparation (higher ed); Grow Your Own and CTE; workforce development.
- K-12 uses: new teacher induction and mentoring, principal pipeline / aspiring leaders, ongoing PD and recertification, measuring PD impact.
- Higher ed uses: teacher, leader and counselor preparation courses, virtual practicum, accreditation evidence (CAEP, AAQEP), practice before field placement.
- Independent school uses: new faculty onboarding, leadership development for heads and division heads, reducing burnout, consistent professional growth.
- Research: De Jong & Dexter analyzed 826 responses from 59 school leadership students across 14 online leadership sims; self-debriefing supported all four phases of Kolb's experiential learning cycle. University of South Dakota study: school leaders reported increased confidence to handle real situations. Auburn University study: sims "taught that every decision has a consequence" and "created a safe environment in which to make mistakes."
- Testimonials (quote exactly if used, with name and organization):
  "Aspiring principals need opportunities to practice leadership, not simply learn about it." Dr. Trent Grundmeyer, Buena Vista University
  "We use SchoolSims as virtual practicum within six of our ten M.Ed. courses." Sara Dexter, Ed.D., University of Virginia
  "Simulations build confidence, sharpen critical thinking, and offer a safe environment." Dr. Suzy Hardie, University of South Carolina
  "Difficult conversations may be had from various perspectives thanks to simulations." Brandon Cummings, Director of Leadership Development, School District of Philadelphia
  "Platform's flexibility allowed us to address specific areas tailored to individual needs." Brandy Hogue, Coordinator of Leadership Development, Volusia County Schools
  "Simulations provide a safe space to practice decision-making and develop skills." Dr. Reginald Pierre-Jerome, School District of Broward County
  "Simulations allowed us to apply our focus and give us flexibility in our program." Stephanie Jackson, Principal, Orange County Public Schools
  "Workshop evaluations on simulations have consistently received outstanding ratings." Dr. Paul M. Healey, PA Principals Association
  "Simulations significantly improved student engagement and leadership development." Gary Astles, SUNY Cortland
- Links you may use (plain URLs, at most one per email):
  Try a sim: https://content.schoolsims.com/try-a-sim
  Book a demo: https://www.schoolsims.com/demo-request/
  Pricing quote: https://www.schoolsims.com/pricing/
  Simulation library: https://www.schoolsims.com/simulations/
  AI coaching: https://www.schoolsims.com/solutions/ai-coaching/
- Company phone: 484-240-9520. West Chester, PA.`;

const LABEL={prospect:"Prospect",client:"Client",former:"Former client",district:"K-12 district",higher:"Higher ed",indep:"Independent school",other:"Other",prospecting:"Prospecting",proactive:"Client proactive outreach",renewal:"Renewal"};
const CTAS={prospecting:["20-minute call to see one sim","Try a sim on their own","Forward to the right person"],proactive:["15-minute check-in","Set up a faculty or staff session","Share the AI coaching debrief"],renewal:["Confirm renewal intent","Send the renewal quote","Get the PO started"]};
const HINT={prospecting:{prospect:"",client:"Prospecting an existing client usually means a new department or school. Say so in the context.",former:"For a former client this reads as a win-back. Mention what's new since they left."},proactive:{prospect:"Proactive outreach is meant for clients. For a prospect, Prospecting usually fits better.",client:"",former:"For a former client, focus on what's changed and why now."},renewal:{prospect:"Renewal only applies to current clients.",client:"",former:"For a former client, this becomes a re-start offer."}};

/* ---------- send timing (recipient's local time) ---------- */
const TIMES={district:{days:[2,3,4],slots:["6:45 AM","3:45 PM"],why:"Before first bell or right after dismissal, Tuesday to Thursday."},higher:{days:[2,3,4],slots:["9:15 AM","1:30 PM"],why:"Mid-morning or early afternoon, Tuesday to Thursday. Avoid Mondays and Fridays."},indep:{days:[2,3,4],slots:["7:15 AM","3:30 PM"],why:"Early morning before classes or mid-afternoon, Tuesday to Thursday."},other:{days:[2,3,4],slots:["9:00 AM","2:00 PM"],why:"Mid-morning or early afternoon, Tuesday to Thursday."}};
const GAPS={prospecting:[0,3,8],proactive:[0,6,13],renewal:[0,7,14],winback:[0,5,12]};
function nextOkDay(d,days){const x=new Date(d);while(!days.includes(x.getDay()))x.setDate(x.getDate()+1);return x}
function addBiz(d,n){const x=new Date(d);let k=0;while(k<n){x.setDate(x.getDate()+1);if(x.getDay()%6)k++}return x}
const fmtDay=d=>d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
function schedule(v){const T=TIMES[v.ind];let start=v.start?new Date(v.start+"T12:00:00"):new Date();start.setHours(12,0,0,0);
  let gaps=v.type==="former"&&v.purpose!=="renewal"?GAPS.winback:GAPS[v.purpose];let note="";
  if(v.purpose==="renewal"&&v.renew){const end=new Date(v.renew+"T12:00:00");const days=Math.round((end-start)/864e5);
    if(days>100){const s=new Date(end);s.setDate(s.getDate()-90);start=s;note="Starts 90 days before the contract end, then 60 and 30 days out."}
    if(days>60)gaps=[0,21,42];else if(days>21)gaps=[0,7,14];else{gaps=[0,2,5];note="The contract ends soon, so the spacing is tight."}}
  const out=[];let d=nextOkDay(start,T.days);
  gaps.forEach((g,i)=>{let x=i===0?d:nextOkDay(addBiz(out[0].d,gaps[i]),T.days);if(i&&x<=out[i-1].d)x=nextOkDay(addBiz(out[i-1].d,2),T.days);out.push({d:x,t:T.slots[i%2]})});
  const warn=[];out.forEach(o=>{const m=o.d.getMonth(),day=o.d.getDate();
    if((m===11&&day>=18)||(m===0&&day<=5))warn.push(`${fmtDay(o.d)} is in the winter break. Expect slow replies.`);
    if(v.ind!=="higher"&&(m===7||(m===8&&day<=7)))warn.push(`${fmtDay(o.d)} is back-to-school. K-12 inboxes are at their fullest.`);
    if(v.ind==="higher"&&((m===4&&day>=1&&day<=20)||(m===11&&day>=1&&day<=17)))warn.push(`${fmtDay(o.d)} falls near finals. Faculty replies slow down.`);
    if(v.ind!=="higher"&&(m===3||(m===4&&day<=20)))warn.push(`${fmtDay(o.d)} is state-testing season in many districts.`)});
  return{items:out,why:T.why,note,warn:[...new Set(warn)]}}

/* ---------- checks on the generated text ---------- */
const SPAM=/\b(free|guarantee[d]?|act now|limited time|risk[- ]free|100%|urgent|click here|no obligation|amazing|revolutionary|game[- ]changer)\b/gi;
function lint(e,v){const w=e.body.trim().split(/\s+/).length;const lim=v.len==="short"?90:140;const out=[];
  if(w>lim+10)out.push(`${w} words. Trim toward ${lim}.`);
  const sp=[...new Set((e.body+" "+e.subject).match(SPAM)||[])].filter(x=>!/risk[- ]free/i.test(x)||true);if(sp.length)out.push(`Spam-filter words: ${sp.join(", ")}`);
  if((e.body.match(/!/g)||[]).length>1)out.push("More than one exclamation mark.");
  if((e.body.match(/https?:\/\//g)||[]).length>1)out.push("More than one link. Plain-text emails with several links land in spam more often.");
  if(/\[[^\]]+\]/.test(e.body))out.push("Has a [placeholder] to fill in before sending.");
  if(/\*\*|^#|^\s*[-*•]\s/m.test(e.body))out.push("Has formatting characters. Keep it plain text.");
  if(e.subject.length>55)out.push(`Subject is ${e.subject.length} characters. Under 50 reads best on phones.`);
  return{w,issues:out}}

/* ---------- generation ---------- */
let sampleFn=null,engine="none";
async function detect(){if(window.claude?.use){try{sampleFn=await claude.use("sample")}catch{}if(sampleFn){engine="sample";paintEngine();return}}
  try{const r=await fetch("/api/write");if(r.ok&&(await r.json()).configured){engine="api"}}catch{}paintEngine()}
function paintEngine(){$("#engine").textContent={sample:"Writing with Claude",api:"Writing with Claude",none:"AI not connected"}[engine];
  $("#goNote").textContent=engine==="none"?"The AI writer isn't connected here yet. On the team's Vercel site it works once ANTHROPIC_API_KEY is set.":"Takes about 20 to 40 seconds. Review every email before it goes out."}
function vals(){return{type:$("#fType").value,ind:$("#fInd").value,purpose:$("#fPurpose").value,title:$("#fTitle").value.trim(),first:$("#fFirst").value.trim(),org:$("#fOrg").value.trim(),renew:$("#fRenew").value,context:$("#fContext").value.trim(),cta:$("#fCta").value.trim(),sName:$("#sName").value.trim(),sTitle:$("#sTitleIn").value.trim(),sPhone:$("#sPhone").value.trim(),len:$("#fLen").value,tone:$("#fTone").value,start:$("#fStart").value,optout:$("#fOpt").checked}}
function buildPrompt(v,sched){const first=v.first||"{{contact.firstname}}",org=v.org||"{{company.name}}";
  const flow={prospecting:"Email 1: a short, specific opener tied to their role and the context, with one clear ask. Email 2: a different angle with one proof point (a research finding or a named testimonial that fits their segment), referencing the voicemail you left. Email 3: a brief, polite close-the-loop note that makes it easy to say 'not now' or point to the right person.",
   proactive:"Email 1: a helpful check-in based on the context (usage, goals, what's coming up in their calendar), offering something concrete. Email 2: share one practical idea or feature they may not be using (for example the AI Coaching Debrief or the insights dashboard), referencing the voicemail. Email 3: a short follow-up that proposes a specific next step.",
   renewal:"Email 1: get ahead of the renewal: confirm plans, the approval process and who signs off. Email 2: recap the value they got and what's new, reference the voicemail, and offer the quote or PO paperwork. Email 3: a clear, friendly nudge with the specific next step and timing."}[v.purpose];
  const winback=v.type==="former"?"This is a former client: acknowledge the past relationship briefly, lead with what's new (AI Coaching Debrief, dashboards, new programs) and why now, and never guilt them.":"";
  return `You write sales emails for SchoolSims, a small edtech company. Write a 3-email sequence plus one voicemail script.

RECIPIENT
- Contact type: ${LABEL[v.type]}
- Organization type: ${LABEL[v.ind]}
- Job title: ${v.title||"not given"}
- First name: ${first}
- Organization: ${org}
${v.renew?`- Contract end date: ${v.renew}\n`:""}
PURPOSE: ${LABEL[v.purpose]}
${flow}
${winback}

CONTEXT FROM THE SENDER (use it; it matters more than generic claims):
${v.context||"(none given)"}

CALL TO ACTION: ${v.cta||"a short call"}

SENDER: ${v.sName||"[Your name]"}${v.sTitle?", "+v.sTitle:""}, SchoolSims${v.sPhone?", "+v.sPhone:""}

SEND PLAN: Email 1 ${fmtDay(sched.items[0].d)}; voicemail the morning of Email 2; Email 2 ${fmtDay(sched.items[1].d)}; Email 3 ${fmtDay(sched.items[2].d)}.

${FACTS}

RULES
- Plain text only. No markdown, no bold, no bullet symbols, no HTML. Short paragraphs separated by one blank line.
- ${v.len==="short"?"Each body under 90 words.":"Each body under 140 words."} Tone: ${{warm:"warm, human and specific",direct:"direct and brief, no warm-up",formal:"respectful and formal, suited to a superintendent or dean"}[v.tone]}.
- Start with "${v.first?"Hi "+v.first:"Hi "+first},". End with the sender's name, then "SchoolSims" and the phone on separate lines.
- Write to this person's role: what they are responsible for and what a SchoolSims simulation changes for them. Use the organization type's language (district: induction, principal pipeline, PD; higher ed: courses, candidates, field placement, accreditation; independent school: faculty, division heads, NAIS).
- Use only the SchoolSims facts above. No invented statistics, customer names or features. Quote testimonials exactly.
- One ask per email. At most one link per email, and only from the list above.
- Avoid spam-trigger words (free, guarantee, act now, limited time, urgent, click here) and exclamation marks.
- Subject lines: under 50 characters, lowercase-friendly, no clickbait. Email 2 and 3 may reply to the thread ("Re: ...") only if natural.
- Voicemail: about 25 seconds spoken, says the sender's name and phone number twice, and says an email is coming.
- Leave the HubSpot tokens {{contact.firstname}} and {{company.name}} exactly as written if they appear.${v.optout?`\n- End each email body with this line after the signature: "If you'd rather not hear from me, just reply and let me know."`:""}

Reply with only JSON:
{"emails":[{"subject":"","alt_subject":"","body":""},{"subject":"","alt_subject":"","body":""},{"subject":"","alt_subject":"","body":""}],"voicemail":"","personalize":["one short tip for what to check or personalize before sending", "..."]}`}
async function generate(v,sched){const prompt=buildPrompt(v,sched);
  if(engine==="sample")return await sampleFn.json(prompt,{modelTier:"default",cache:false});
  const r=await fetch("/api/write",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"The writer couldn't respond. Try again.");return j}

/* ---------- render ---------- */
let current=null;
function render(res,v,sched,example){current={res,v,sched};const s=sched.items;const lab=["Email 1","Email 2","Email 3"];
  const emails=res.emails.map((e,i)=>{const L=lint(e,v);return `<article class="card mail"><div class="mh"><div><span class="label">${lab[i]} · ${fmtDay(s[i].d)}, ${s[i].t}</span></div><div class="acts"><button class="btn sm" data-copy="s${i}">Copy subject</button><button class="btn sm" data-copy="b${i}">Copy body</button></div></div>
    <div class="subj"><span class="label">Subject</span><div id="s${i}" class="sv" contenteditable="true" spellcheck="true">${esc(e.subject)}</div>${e.alt_subject?`<div class="alt">Alternate: <button class="linkbtn" data-alt="${i}">${esc(e.alt_subject)}</button></div>`:""}</div>
    <textarea id="b${i}" class="body" spellcheck="true" rows="${Math.min(22,e.body.split("\n").length+2)}">${esc(e.body)}</textarea>
    <div class="lint">${L.issues.length?L.issues.map(x=>`<span class="warn">${esc(x)}</span>`).join(""):`<span class="ok">Plain text · ${L.w} words · no spam words</span>`}</div></article>`}).join("");
  $("#out").innerHTML=`${example?`<div class="banner">Example output for a prospect at a K-12 district. Fill in the form and click Write 3 emails for your own.</div>`:""}
  <div class="card sched"><div class="shd"><h2>Send plan</h2><span class="muted small">${esc(LABEL[v.type])} · ${esc(LABEL[v.ind])} · ${esc(LABEL[v.purpose])}</span></div>
    <ol class="steps">${s.map((x,i)=>`<li><b>${fmtDay(x.d)}, ${x.t}</b><span>${i===1?"Call first. If no answer, leave the voicemail, then send Email 2.":lab[i]}${i===0?" goes out.":i===2?" goes out if there's no reply.":""}</span></li>`).join("")}</ol>
    <p class="muted small">${esc(sched.why)} Times are in the recipient's local time. ${esc(sched.note)} Stop the sequence as soon as they reply.</p>
    ${sched.warn.length?`<div class="warnbox">${sched.warn.map(esc).join("<br>")}</div>`:""}</div>
  ${emails}
  <article class="card mail"><div class="mh"><span class="label">Voicemail · ${fmtDay(s[1].d)}, before Email 2</span><div class="acts"><button class="btn sm" data-copy="vm">Copy</button></div></div><textarea id="vm" class="body" rows="6">${esc(res.voicemail||"")}</textarea></article>
  ${res.personalize?.length?`<div class="card"><h3>Before you send</h3><ul class="tips">${res.personalize.map(t=>`<li>${esc(t)}</li>`).join("")}<li>Send from your own inbox or a HubSpot sequence, not a marketing email, so it stays plain text and replies come to you.</li></ul></div>`:""}
  <div class="rowbtns"><button class="btn" id="copyAll">Copy everything</button>${example?"":`<button class="btn" id="again">Write a different version</button>`}</div>`;
  const fit=t=>{t.style.height="auto";t.style.height=(t.scrollHeight+4)+"px"};document.querySelectorAll("#out textarea").forEach(t=>{fit(t);t.addEventListener("input",()=>fit(t))});
  $("#copyAll").onclick=()=>{const t=[0,1,2].map(i=>`${lab[i]} (${fmtDay(s[i].d)}, ${s[i].t})\nSubject: ${$("#s"+i).textContent}\n\n${$("#b"+i).value}`).join("\n\n------\n\n")+`\n\n------\n\nVoicemail\n${$("#vm").value}`;copy(t)};
  $("#again")?.addEventListener("click",()=>$("#form").requestSubmit())}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.copy){const el=$("#"+b.dataset.copy);copy(el.value??el.textContent,el)}
  if(b.dataset.alt){const i=b.dataset.alt,sv=$("#s"+i),old=sv.textContent;sv.textContent=b.textContent;b.textContent=old}
  if(b.dataset.cta){$("#fCta").value=b.dataset.cta;save()}});
$("#form").addEventListener("submit",async e=>{e.preventDefault();const v=vals();save();const sched=schedule(v);
  if(engine==="none"){toast("The AI writer isn't connected in this view");return}
  const btn=$("#go");btn.disabled=true;btn.textContent="Writing…";$("#out").innerHTML=`<div class="card thinking"><span class="spin" aria-hidden="true"></span> Writing three emails for a ${esc(LABEL[v.type].toLowerCase())} at a ${esc(LABEL[v.ind].toLowerCase())}…</div>`;
  try{const res=await generate(v,sched);if(!Array.isArray(res?.emails)||res.emails.length<3)throw{code:"invalid_json"};render(res,v,sched,false)}
  catch(err){const c=err?.code;const msg=c==="not_granted"||c==="sampling_disabled"?"Claude access wasn't allowed in this view.":c==="rate_limited"?"Too many requests. Wait a minute and try again.":c==="invalid_json"?"The writer returned something unexpected. Try again.":(err?.message||"Something went wrong. Try again.");$("#out").innerHTML=`<div class="card warnbox">${esc(msg)}</div>`}
  finally{btn.disabled=false;btn.textContent="Write 3 emails"}});

/* ---------- form state ---------- */
const IDS=["fType","fInd","fPurpose","fTitle","fFirst","fOrg","fRenew","fContext","fCta","sName","sTitleIn","sPhone","fLen","fTone","fStart","fOpt"];
function save(){const o={};IDS.forEach(id=>{const el=$("#"+id);o[id]=el.type==="checkbox"?el.checked:el.value});store.set("form",o)}
function restore(){const o=store.get("form",null);if(o)IDS.forEach(id=>{const el=$("#"+id);if(o[id]==null)return;if(el.type==="checkbox")el.checked=o[id];else el.value=o[id]});else $("#fOpt").checked=true;
  const t=new Date();t.setDate(t.getDate()+1);const iso=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;if(!$("#fStart").value||$("#fStart").value<iso)$("#fStart").value=iso}
function syncForm(){const p=$("#fPurpose").value,ty=$("#fType").value;$("#renewWrap").hidden=p!=="renewal";$("#purposeHint").textContent=HINT[p][ty]||"";
  $("#ctaChips").innerHTML=CTAS[p].map(c=>`<button type="button" class="chip" data-cta="${esc(c)}">${esc(c)}</button>`).join("")}
IDS.forEach(id=>$("#"+id).addEventListener("change",()=>{save();syncForm()}));["fType","fPurpose"].forEach(id=>$("#"+id).addEventListener("change",()=>{if(id==="fPurpose")$("#fOpt").checked=$("#fPurpose").value==="prospecting"}));

const EXAMPLE={emails:[
